[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "promcp"
version     = "0.2.0"
description = "Proactive MCP — decorators and linter for proMCP-compliant MCP servers"
readme      = "README.md"
license     = "Apache-2.0"
authors     = [
    { name = "@alexlqi", email = "alexlqi@users.noreply.github.com" },
]
keywords    = [
    "mcp", "model-context-protocol", "ai-agents",
    "llm", "agentic", "tool-design", "promcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"

dependencies = [
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
mcp  = ["mcp>=1.0"]
dev  = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage      = "https://github.com/alexlqi/tmcp"
Repository    = "https://github.com/alexlqi/tmcp"
Documentation = "https://github.com/alexlqi/tmcp/blob/main/SPEC.md"
"Bug Tracker" = "https://github.com/alexlqi/tmcp/issues"

[project.scripts]
promcp-lint = "promcp.linter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["promcp*"]

[tool.setuptools.package-data]
promcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
